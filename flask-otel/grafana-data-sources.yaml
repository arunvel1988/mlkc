apiVersion: 1
datasources:
  # Logs - Loki
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki-test-gateway.loki-test.svc.cluster.local
    jsonData:
      maxLines: 1000
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "fake"   # or "1" depending on your Loki auth
    editable: true

  # Traces - Tempo
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo-query-frontend.tempo-test.svc.cluster.local:3200
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        mapTagNamesEnabled: true
      tracesToMetrics:
        datasourceUid: mimir
        tags: ["job"]
        queries:
          - name: "Request Rate"
            query: "rate(http_requests_total[5m])"
      serviceMap:
        datasourceUid: tempo
    editable: true

  # Metrics - Mimir
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir-gateway.mimir-test.svc.cluster.local:80
    jsonData:
      timeInterval: "10s"
      prometheusType: "Mimir"
      exemplarTraceIdDestinations:
        - datasourceUid: tempo
    editable: true
